[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-mind-map-generator"
version = "0.5.2"
description = "AI-powered desktop mind map generator for Windows. Turn text, PDFs, and markdown into navigable concept maps."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
authors = [{ name = "Potato Labs", email = "oss@ai-mind-map-generator.dev" }]
keywords = ["mindmap", "ai", "knowledge-graph", "windows", "desktop", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PySide6>=6.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "networkx>=3.3",
  "pypdf>=4.2",
  "markdown-it-py>=3.0",
  "keyring>=25.2",
  "platformdirs>=4.2",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-qt>=4.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
local-llm = ["llama-cpp-python>=0.2.79"]

[project.scripts]
mmg = "mindmap.__main__:main"

[project.gui-scripts]
mmg-gui = "mindmap.app:run"

[tool.hatch.build.targets.wheel]
packages = ["mindmap"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mindmap/core", "mindmap/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"